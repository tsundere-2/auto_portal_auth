<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Portal 自动连接</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      width: 300px; margin: 0; padding: 14px 16px 16px;
      font: 13px/1.5 "Microsoft YaHei", system-ui, sans-serif;
    }
    h1 { font-size: 14px; margin: 0 0 10px; }
    .row { display: flex; align-items: center; justify-content: space-between; margin: 9px 0; }
    .row label { user-select: none; }
    .muted { color: #888; font-size: 12px; }
    #status {
      margin: 10px 0; padding: 8px 10px; border-radius: 6px;
      background: rgba(127,127,127,.12); font-size: 12px; min-height: 34px;
      word-break: break-all;
    }
    button {
      width: 100%; padding: 7px 10px; margin-top: 8px; border-radius: 6px;
      border: 1px solid rgba(127,127,127,.5); background: transparent;
      cursor: pointer; font: inherit;
    }
    button.primary { background: #1677ff; border-color: #1677ff; color: #fff; }
    button:hover { filter: brightness(1.08); }
    input[type="number"] { width: 68px; padding: 2px 4px; }
    .ok { color: #16a34a; }
    .warn { color: #d97706; }
    hr { border: 0; border-top: 1px solid rgba(127,127,127,.25); margin: 12px 0; }
  </style>
</head>
<body>
  <h1>校园网 Portal 自动连接</h1>

  <div class="row">
    <label for="enabled">启用自动点击</label>
    <input type="checkbox" id="enabled">
  </div>
  <div class="row">
    <label for="delay">页面加载后延迟</label>
    <span><input type="number" id="delay" min="0" max="30000" step="100"> ms</span>
  </div>

  <div id="status">正在读取当前页面…</div>

  <button class="primary" id="run">立即在本页执行一次</button>
  <button id="allow">本网站总是启用</button>

  <hr>
  <div class="muted" id="last">暂无操作记录</div>

  <script src="popup.js"></script>
</body>
</html>
